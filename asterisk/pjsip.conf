; ============================================================
;  PJSIP – trunk opérateur + softphone de test
;  Généré par deploy/install.sh à partir de .env
; ============================================================

[global]
type=global
user_agent=Naoned PBX
endpoint_identifier_order=ip,username

[transport-udp]
type=transport
protocol=udp
bind=0.0.0.0:5060
external_media_address={{PUBLIC_IP}}
external_signaling_address={{PUBLIC_IP}}

; ---------- Trunk opérateur (enregistrement) ----------
[trunk]
type=registration
transport=transport-udp
outbound_auth=trunk-auth
server_uri=sip:{{SIP_PROVIDER_HOST}}
client_uri=sip:{{SIP_USERNAME}}@{{SIP_PROVIDER_HOST}}
contact_user={{SIP_USERNAME}}
retry_interval=60
forbidden_retry_interval=600
expiration=600
line=yes
endpoint=trunk

[trunk-auth]
type=auth
auth_type=userpass
username={{SIP_USERNAME}}
password={{SIP_PASSWORD}}

[trunk]
type=aor
contact=sip:{{SIP_PROVIDER_HOST}}
qualify_frequency=60

[trunk]
type=endpoint
transport=transport-udp
context=from-trunk
disallow=all
allow=alaw,ulaw
outbound_auth=trunk-auth
aors=trunk
from_user={{SIP_USERNAME}}
from_domain={{SIP_PROVIDER_HOST}}
direct_media=no
rtp_symmetric=yes
force_rport=yes
rewrite_contact=yes
dtmf_mode=rfc4733
send_pai=yes

[trunk]
type=identify
endpoint=trunk
match={{SIP_PROVIDER_HOST}}

; ---------- Softphone de test (extension 6001) ----------
; Configurez Linphone/Zoiper avec : utilisateur 6001, mot de passe TEST_PHONE_PASSWORD,
; domaine = IP du VPS. Composez le 100 pour parler à l'assistant.
[6001]
type=endpoint
transport=transport-udp
context=from-internal
disallow=all
allow=ulaw,alaw,opus
auth=6001-auth
aors=6001
direct_media=no
rtp_symmetric=yes
force_rport=yes
rewrite_contact=yes

[6001-auth]
type=auth
auth_type=userpass
username=6001
password={{TEST_PHONE_PASSWORD}}

[6001]
type=aor
max_contacts=2
remove_existing=yes
