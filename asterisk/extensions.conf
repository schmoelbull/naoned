; ============================================================
;  Plan de numérotation Naoned
; ============================================================
[globals]
NAONED_APP={{ARI_APP}}

; Appels entrants depuis l'opérateur → assistant IA
[from-trunk]
exten => _[+0-9].,1,NoOp(Appel entrant de ${CALLERID(num)} vers ${EXTEN})
 same => n,Stasis(${NAONED_APP})
 same => n,Hangup()
exten => s,1,Goto(from-trunk,assistant,1)
exten => assistant,1,Stasis(${NAONED_APP})
 same => n,Hangup()

; Softphone de test
[from-internal]
exten => 100,1,NoOp(Test assistant IA)
 same => n,Stasis(${NAONED_APP})
 same => n,Hangup()
; Appels sortants depuis le softphone (facultatif) : 0XXXXXXXXX
exten => _0XXXXXXXXX,1,Dial(PJSIP/${EXTEN}@trunk,60)
 same => n,Hangup()

; Transfert demandé par l'assistant (variable posée par Node.js)
[naoned-transfer]
exten => s,1,NoOp(Transfert vers ${NAONED_TRANSFER_TO})
 same => n,Dial(PJSIP/${NAONED_TRANSFER_TO}@trunk,30)
 same => n,Playback(vm-nobodyavail)
 same => n,Hangup()
